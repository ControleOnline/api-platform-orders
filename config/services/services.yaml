services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true 
    ControleOnline\:
        resource: '../../src/*'
        # OrderProductTreeConsolidator is assembled internally with mutation callbacks.
        exclude: '../../src/{DependencyInjection,Entity,Resource,Migrations,Library,Message,Tests,Service/OrderProductTreeConsolidator.php,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'
